# Hand-written ATT&CK rules. Priority: first matching CWE, then keyword, then fallback.
# Do not add techniques in Python. Edit this file.

cwe_rules:
  CWE-78:
    technique_id: T1059
    technique_name: "Command and Scripting Interpreter"
    rationale: "OS command injection runs a command interpreter on the host."

  CWE-94:
    technique_id: T1059
    technique_name: "Command and Scripting Interpreter"
    rationale: "Code injection makes the product execute attacker-controlled code."

  CWE-79:
    technique_id: T1059.007
    technique_name: "Command and Scripting Interpreter: JavaScript"
    rationale: "Cross-site scripting runs attacker JavaScript in a browser."

  CWE-89:
    technique_id: T1190
    technique_name: "Exploit Public-Facing Application"
    rationale: "SQL injection is exploitation of an application input. ATT&CK has no separate SQLi technique."

  CWE-22:
    technique_id: T1005
    technique_name: "Data from Local System"
    rationale: "Path traversal in this catalog is used to read files on the host, which is collection rather than only discovery."

  CWE-502:
    technique_id: T1190
    technique_name: "Exploit Public-Facing Application"
    rationale: "KEV deserialization bugs are exploited on network services. Client Execution (T1203) would mis-state that."

  CWE-918:
    technique_id: T1090
    technique_name: "Proxy"
    rationale: "ATT&CK has no SSRF technique. Proxy is the closest fit: the vulnerable server relays the attacker's request."

  CWE-434:
    technique_id: T1505.003
    technique_name: "Server Software Component: Web Shell"
    rationale: "Unrestricted upload entries in KEV are used to plant a web shell."

  CWE-287:
    technique_id: T1078
    technique_name: "Valid Accounts"
    rationale: "Improper authentication lets the attacker act as an account the check was meant to gate. This is not a claim that a password was stolen."

  CWE-288:
    technique_id: T1078
    technique_name: "Valid Accounts"
    rationale: "An alternate-path authentication bypass reaches an authenticated state, so it is grouped with Valid Accounts."

  CWE-259:
    technique_id: T1078
    technique_name: "Valid Accounts"
    rationale: "A hard-coded password is a real credential the attacker can use."

  CWE-306:
    technique_id: T1190
    technique_name: "Exploit Public-Facing Application"
    rationale: "Missing authentication exposes a critical function with no account involved, so this is not Valid Accounts."

  CWE-269:
    technique_id: T1068
    technique_name: "Exploitation for Privilege Escalation"
    rationale: "Improper privilege management is exploited to gain higher privileges."

  CWE-862:
    technique_id: T1068
    technique_name: "Exploitation for Privilege Escalation"
    rationale: "Missing authorization lets a less-privileged caller reach a privileged function."

keyword_rules:
  - keywords: ["escalat", "elevat", "privileged access"]
    technique_id: T1068
    technique_name: "Exploitation for Privilege Escalation"
    rationale: "The name or description says privileges were raised and no CWE rule matched. Bare 'privilege' is not used, so a Cisco 'show privilege' command is not treated as escalation."

  - keywords: ["command injection", "code injection"]
    technique_id: T1059
    technique_name: "Command and Scripting Interpreter"
    rationale: "The name or description says command or code injection and no CWE rule matched."

  - keywords: ["traversal"]
    technique_id: T1005
    technique_name: "Data from Local System"
    rationale: "The name or description says path traversal and no CWE rule matched."

fallback:
  technique_id: T1190
  technique_name: "Exploit Public-Facing Application"
  rationale: "default for KEV entries"
