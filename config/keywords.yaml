# Cloud and CI/CD product tokens.
# Matched as whole words in vendorProject, product, and vulnerabilityName.
# The bare word "cloud" is omitted on purpose: it tags VeloCloud, ownCloud,
# and Cisco Security Cloud Control, which are not this list.
keywords:
  - kubernetes
  - docker
  - jenkins
  - gitlab
  - github
  - gitea
  - argo
  - terraform
  - ansible
  - puppet
  - chef
  - helm
  - istio
  - envoy
  - openshift
  - rancher
  - hashicorp
  - vault
  - consul
  - nomad
  - packer
  - aws
  - azure
  - gcp
  - cloudflare
  - lambda
  - s3
  - ec2
  - container
  - ci/cd
  - jfrog
  - artifactory
  - teamcity
  - vmware
  - vcenter
  - kestra
  - mlflow
